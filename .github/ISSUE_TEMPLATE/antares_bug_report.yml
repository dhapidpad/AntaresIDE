name: Antares IDE bug report
description: Report a reproducible Antares IDE issue
body:
  - type: input
    id: version
    attributes:
      label: Antares version / commit
      placeholder: commit SHA or release tag
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS and environment
      placeholder: Codespaces / Linux / Windows / macOS
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and logs (remove secrets)
    validations:
      required: true
